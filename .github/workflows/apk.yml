name: APK 빌드

# main 에 앱 코드가 바뀌면 자동으로, 또는 Actions 탭에서 "Run workflow" 로 수동 실행.
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # 서명된 빌드를 Releases 에 올리기 위해 필요

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # ubuntu-latest 가 26 으로 바뀌는 중이라 Android 도구가 검증된 24.04 로 고정
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      # 서명 키는 저장소에 포함된 '공개 키'(android/app/childcare-public.jks)를 쓴다. 시크릿 등록이 필요 없다.
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/childcare-public.jks
      ANDROID_KEYSTORE_PASSWORD: childcare-public
      ANDROID_KEY_ALIAS: childcare
      ANDROID_KEY_PASSWORD: childcare-public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 웹 앱 점검 (서버 없이 도는 단위 테스트)
        run: |
          npm ci
          node --test test/unit/store.test.js test/unit/api.test.js test/unit/format.test.js test/unit/cardstate.test.js test/unit/lock.test.js test/unit/native.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        continue-on-error: true   # 실패해도 러너에 미리 깔린 Android SDK 로 이어간다

      - name: Android SDK 라이선스 동의 (미리 깔린 SDK 사용)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SM="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SM" ]; then yes | "$SM" --licenses >/dev/null 2>&1 || true; fi
          echo "sdk.dir=$SDK" > android/local.properties

      - name: 웹 파일을 안드로이드 프로젝트로 복사
        run: npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          TASK=assembleRelease
          set +e
          ./gradlew --no-daemon --stacktrace "$TASK" > ../gradle-build.log 2>&1
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # 실패 원인을 Annotations 에 요약해서 보여준다 (로그를 열지 않아도 확인 가능)
            MSG="$(grep -n -A14 -E 'What went wrong|FAILURE:' ../gradle-build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            echo "::error title=Gradle 실패::${MSG:-$(tail -25 ../gradle-build.log | sed ':a;N;$!ba;s/\n/%0A/g')}"
            exit "$RC"
          fi
          cp app/build/outputs/apk/release/app-release.apk "../childcare-v${APP_VERSION_CODE}.apk"

      - name: 빌드 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore

      - name: APK 보관 (Actions > 실행 > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: childcare-apk-${{ github.run_number }}
          path: childcare-v*.apk
          if-no-files-found: error

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_CODE}" "childcare-v${APP_VERSION_CODE}.apk" \
            --title "가정 내 자본주의 v${APP_VERSION_CODE}" \
            --notes "휴대폰에서 이 APK 를 내려받아 설치하세요. (기존 앱 위에 덮어써집니다)"
